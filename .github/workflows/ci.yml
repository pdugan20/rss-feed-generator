name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Install test browser
        run: |
          sudo env PUPPETEER_CACHE_DIR="$HOME/.cache/puppeteer"             "$(command -v node)" ./node_modules/.bin/puppeteer browsers install chrome --install-deps

      - name: Run tests
        run: npm run test:ci
        env:
          API_KEY: test-api-key
          NODE_ENV: test

      - name: Verify real browser boundaries
        # Match the root-run Railway image in an ephemeral CI fixture; do not
        # weaken the runner's global AppArmor or user-namespace configuration.
        run: |
          npm run build
          test_browser=$(node --input-type=module -e 'import puppeteer from "puppeteer"; console.log(puppeteer.executablePath())')
          "$test_browser" --version
          sudo env PUPPETEER_EXECUTABLE_PATH="$test_browser" PUPPETEER_CACHE_DIR="$HOME/.cache/puppeteer" NODE_ENV=test             "$(command -v node)" dist/scripts/verify-browser-boundary.js
        env:
          NODE_ENV: test

  claudelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify automation policy
        run: npm run test:automation-policy
      - name: Lint Claude Code config
        run: ./node_modules/.bin/claudelint check-all --format github --no-cache

  ci-gate:
    name: CI Gate
    if: always()
    needs: [claudelint, lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "A required job finished with: $result"
              exit 1
            fi
          done
